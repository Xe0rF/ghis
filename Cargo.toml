[package]
name = "ghis"
version = "0.1.0"
edition = "2024"
description = "Per-repository GitHub identity switcher for git, gh, and zsh"
license = "AGPL-3.0-or-later"
rust-version = "1.97"
exclude = ["/dist/"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "string"] }
clap_complete = "4.6"
crossterm = "0.29"
fd-lock = "4.0"
globset = "0.4"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.20"
toml_edit = { version = "0.25.13", features = ["serde", "display"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
zeroize = "1.8"

[dev-dependencies]
assert_cmd = "2.0"
insta = { version = "1.48", default-features = false }
predicates = "3.1"

[[bin]]
name = "ghis"
path = "src/main.rs"

[lib]
name = "ghis"
path = "src/lib.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
