[package]
name = "ghis"
version = "0.1.0"
edition = "2024"
description = "Per-repository GitHub identity switcher for git, gh, and zsh"
license = "AGPL-3.0-or-later"
rust-version = "1.97"
exclude = ["/dist/"]

[dependencies]
clap = {
    version = "4.6",
    default-features = false,
    features = [
        "std",
        "derive",
        "env",
        "string",
        "help",
        "usage",
        "error-context",
        "suggestions",
    ],
}
clap_complete = "4.6"
fd-lock = "4.0"
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.20"
toml_edit = { version = "0.25.13", features = ["serde", "display"] }
zeroize = "1.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "ghis"
path = "src/main.rs"

[lib]
name = "ghis"
path = "src/lib.rs"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
