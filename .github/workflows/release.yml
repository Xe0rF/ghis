name: release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('release dry-run @ {0}', github.ref_name)
      || format('release {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
  # Manual runs are always dry-runs: they build and validate release archives
  # but never create or update a GitHub Release.
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh, fish, and PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          if ! command -v pwsh >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb \
              -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --test-threads=1
      - run: cargo doc --locked --no-deps
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: bans sources
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Runtime-validated package (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: release-linux-gnu-x86_64
            alpine_smoke: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: release-linux-gnu-aarch64
            alpine_smoke: false
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: release-linux-musl-x86_64
            alpine_smoke: true
          # This smoke runs on GitHub's native Arm64 runner, not under QEMU.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: release-linux-musl-aarch64
            alpine_smoke: true
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: release-macos-aarch64
            alpine_smoke: false
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: release-windows-x86_64
            alpine_smoke: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh musl-tools
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --needed --noconfirm zsh python'
      - name: Build reproducible release archive
        shell: bash
        env:
          GHIS_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: scripts/package-release.sh --target "${{ matrix.target }}"
      - name: Alpine runtime smoke without gcompat
        if: matrix.alpine_smoke
        env:
          GHIS_TARGET: ${{ matrix.target }}
        run: |
          archive=$(find dist -maxdepth 1 -type f -name "ghis-v*-${GHIS_TARGET}.tar.gz" -print -quit)
          test -n "$archive"
          package=$(basename "$archive" .tar.gz)
          docker run --rm \
            -e GHIS_PACKAGE="$package" \
            -v "$PWD/$archive:/tmp/ghis.tar.gz:ro" \
            alpine:3.22 \
            sh -eu -c '
              if apk info --installed gcompat >/dev/null 2>&1; then
                echo "Alpine smoke image unexpectedly contains gcompat" >&2
                exit 1
              fi
              tar -xzf /tmp/ghis.tar.gz -C /tmp
              "/tmp/${GHIS_PACKAGE}/ghis" --version
            '
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  macos-intel-build-only:
    name: Build-only probe (macOS x86_64, excluded from release)
    needs: verify
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Confirm Intel runner and compile without execution
        run: |
          test "$(uname -m)" = x86_64
          cargo build --locked --release --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: build-only-macos-x86_64-not-for-release
          path: target/x86_64-apple-darwin/release/ghis
          if-no-files-found: error

  windows-arm64-build-only:
    name: Build-only probe (Windows ARM64, excluded from release)
    needs: verify
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Confirm ARM64 runner and compile without execution
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected native ARM64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
          cargo build --locked --release --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: build-only-windows-aarch64-not-for-release
          path: target/aarch64-pc-windows-msvc/release/ghis.exe
          if-no-files-found: error

  dry-run:
    name: Validate release dry-run (no GitHub Release)
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify dry-run archives and checksums
        run: |
          cd dist
          archive_count=$(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l)
          checksum_count=$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)
          test "$archive_count" -gt 0
          test "$archive_count" -eq "$checksum_count"
          for checksum in ./*.sha256; do
            sha256sum --check "$checksum"
          done
          {
            echo '### Release dry-run completed'
            echo
            echo "Validated $archive_count archives. No GitHub Release was created."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish runtime-validated archives
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
