name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh, fish, and PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          if ! command -v pwsh >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb \
              -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --test-threads=1
      - run: cargo doc --locked --no-deps
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: bans sources
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: ghis-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: ghis-linux-aarch64
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: ghis-macos-aarch64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ghis-windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh, fish, and PowerShell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          if ! command -v pwsh >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb \
              -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh --version
      - run: cargo test --locked -- --test-threads=1
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --needed --noconfirm zsh python'
      - run: scripts/package-release.sh --target "${{ matrix.target }}"
        shell: bash
        env:
          GHIS_RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ghis-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
